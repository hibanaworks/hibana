name = "hibana_proofs"
version = "0.1.0"
defaultTargets = ["Hibana"]

[[lean_lib]]
name = "Hibana"

# Small source/descriptor inputs are regenerated by the real Rust fixtures.
# Schedules remain JSON data, so widening them does not enlarge elaboration.
[[lean_exe]]
name = "endpointConformance"
root = "EndpointConformanceGenerated"
srcDir = "../../target/lean-proof"
exeName = "endpoint-conformance"

[[lean_exe]]
name = "protocolShapes"
root = "ProtocolShapesGenerated"
srcDir = "../../target/lean-proof"
exeName = "protocol-shapes"

[[lean_exe]]
name = "nestedRollAdmission"
root = "NestedRollAdmissionGenerated"
srcDir = "../../target/lean-proof"
exeName = "nested-roll-admission"
