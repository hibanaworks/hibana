[package]
name = "hibana-ci-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false

[dependencies]
num-bigint = "=0.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }

[[bin]]
name = "kani-cbmc"
path = "kani_cbmc.rs"

[[test]]
name = "tool_failures"
path = "tool_failures.rs"

[[bin]]
name = "compile-pressure"
path = "compile_pressure.rs"

[[bin]]
name = "resource-guard"
path = "resource_guard.rs"

[[bin]]
name = "dispatch-model"
path = "dispatch_model.rs"

[[bin]]
name = "check-lean-theorem-inventory"
path = "check_lean_theorem_inventory.rs"

[[bin]]
name = "check-generated-lean-axioms"
path = "check_generated_lean_axioms.rs"

[[test]]
name = "lean_audit_failures"
path = "lean_audit_failures.rs"

[[bin]]
name = "check-kani-source"
path = "check_kani_source.rs"

[[test]]
name = "kani_audit_failures"
path = "kani_audit_failures.rs"

[[bin]]
name = "pressure-source"
path = "pressure_source.rs"

[[bin]]
name = "smt-model"
path = "smt_model.rs"

[[bin]]
name = "final-measurements"
path = "final_measurements.rs"

[[bin]]
name = "projection-checks"
path = "projection_checks.rs"

[[bin]]
name = "size-snapshot"
path = "size_snapshot.rs"

[[bin]]
name = "check-thumb-codegen"
path = "check_thumb_codegen.rs"

[[test]]
name = "thumb_codegen_failures"
path = "thumb_codegen_failures.rs"

[[bin]]
name = "supplemental-proofs"
path = "supplemental_proofs.rs"

[[bin]]
name = "check-lean-proof-guard"
path = "check_lean_proof_guard.rs"

[[bin]]
name = "test-result"
path = "test_result.rs"

[lints.rust]
long_running_const_eval = "forbid"

[[bin]]
name = "protocol-shapes"
path = "protocol_shapes.rs"

[[bin]]
name = "protocol-shape-partitions"
path = "protocol_shape_partitions.rs"

[[bin]]
name = "protocol-shape-controls"
path = "protocol_shape_controls.rs"

[[bin]]
name = "protocol-shape-rejections"
path = "protocol_shape_rejections.rs"
