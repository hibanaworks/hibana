name: Set up Lean
description: Install the source-selected Lean compiler on macOS or Linux ARM64.
runs:
  using: composite
  steps:
    - name: Install the verified elan release
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s):$(uname -m)" in
          Darwin:arm64)
            asset=elan-aarch64-apple-darwin.tar.gz
            hash=7cae4c03b2f0de4053fb04a91359d5804551e6e37a6ddd1b2e0097dc561ae4a9
            ;;
          Darwin:x86_64)
            asset=elan-x86_64-apple-darwin.tar.gz
            hash=10d037a69731c0593723e018130c5f54afde175796b4af8ba1317e561e55598c
            ;;
          Linux:aarch64)
            asset=elan-aarch64-unknown-linux-gnu.tar.gz
            hash=cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac
            ;;
          *) echo 'Unsupported verification host' >&2; exit 1 ;;
        esac
        elan_tmp="$(mktemp -d)"
        trap 'rm -r -- "$elan_tmp"' EXIT
        curl --proto '=https' --tlsv1.2 -fsSL \
          "https://github.com/leanprover/elan/releases/download/v4.2.3/$asset" \
          -o "$elan_tmp/elan.tar.gz"
        printf '%s  %s\n' "$hash" "$elan_tmp/elan.tar.gz" | shasum -a 256 --check
        tar -xzf "$elan_tmp/elan.tar.gz" -C "$elan_tmp"
        "$elan_tmp/elan-init" -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Reuse the selected compiler
      uses: actions/cache@v6
      with:
        path: ~/.elan/toolchains
        key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain', '.github/actions/setup-lean/action.yml') }}
    - name: Install the source-selected compiler
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(cat proofs/lean/lean-toolchain)"
        elan toolchain install "$toolchain"
        elan run "$toolchain" lean --version
        printf 'ELAN_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
