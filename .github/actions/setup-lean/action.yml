name: Set up Lean
description: Install the pinned Lean compiler on Linux ARM64.
runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(uname -s):$(uname -m)" == Linux:aarch64 ]]
        elan_tmp="$(mktemp -d)"
        trap 'rm -rf "$elan_tmp"' EXIT
        curl --proto '=https' --tlsv1.2 -sSfL \
          https://github.com/leanprover/elan/releases/download/v4.2.3/elan-aarch64-unknown-linux-gnu.tar.gz \
          -o "${elan_tmp}/elan.tar.gz"
        echo "cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac  ${elan_tmp}/elan.tar.gz" | sha256sum --check -
        tar -xzf "${elan_tmp}/elan.tar.gz" -C "${elan_tmp}"
        "${elan_tmp}/elan-init" -y --default-toolchain none
        echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
    - name: Reuse the pinned compiler
      uses: actions/cache@v6
      with:
        path: ~/.elan/toolchains
        key: lean-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain') }}
    - name: Install the pinned compiler
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(< proofs/lean/lean-toolchain)"
        for attempt in 1 2 3; do
          if elan run --install "$toolchain" lean --version; then exit 0; fi
          if [[ "$attempt" == 3 ]]; then exit 1; fi
          sleep 5
        done
