name: quality-gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        required: true
        default: all
        options: [all, final-form, protocol-shapes]
      shape-budget:
        description: Generated constructor budget for protocol-shapes
        type: choice
        required: true
        default: '3'
        options: ['3', '4', '5']
      shape-window:
        description: Window (0 for budget 3, 0 through 31 for budget 4, 0 through 15 for budget 5)
        type: string
        required: true
        default: '0'

jobs:
  runtime-instructions:
    if: github.event_name != 'workflow_dispatch' || inputs.check != 'protocol-shapes'
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install instruction profiler
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          rustup toolchain install stable --profile minimal
      - name: Measure the current kernel instruction counts
        run: >-
          bash .github/scripts/lib/resource_guard.sh
          bash .github/scripts/measure_runtime_instructions.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-instructions
          path: target/runtime-instructions/results/

  protocol-shape-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'protocol-shapes'
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    env:
      SHAPE_BUDGET: ${{ inputs.shape-budget }}
      SHAPE_WINDOW: ${{ inputs.shape-window }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Validate the complete shard assignment
        id: scope
        run: |
          set -euo pipefail
          cargo +stable test --locked --manifest-path .github/ci-tests/Cargo.toml --bin protocol-shape-partitions
          matrix=$(cargo +stable run --locked --manifest-path .github/ci-tests/Cargo.toml \
            --bin protocol-shape-partitions -- matrix "$SHAPE_BUDGET" "$SHAPE_WINDOW")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  protocol-shapes:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'protocol-shapes'
    needs: protocol-shape-matrix
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.protocol-shape-matrix.outputs.matrix) }}
    env:
      TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      SHAPE_BUDGET: ${{ inputs.shape-budget }}
      SHAPE_WINDOW: ${{ inputs.shape-window }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and Lean
        run: |
          rustup toolchain install stable --profile minimal
          ELAN_TMP="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-aarch64-unknown-linux-gnu.tar.gz \
            -o "${ELAN_TMP}/elan.tar.gz"
          echo "cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac  ${ELAN_TMP}/elan.tar.gz" | sha256sum --check -
          tar -xzf "${ELAN_TMP}/elan.tar.gz" -C "${ELAN_TMP}"
          "${ELAN_TMP}/elan-init" -y --default-toolchain none
          rm -rf "${ELAN_TMP}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
      - name: Check every assigned generated protocol
        run: |
          set -euo pipefail
          cargo +stable run --locked --manifest-path .github/ci-tests/Cargo.toml \
            --bin protocol-shape-partitions -- shards "$SHAPE_BUDGET" "$SHAPE_WINDOW" \
            '${{ matrix.partition }}' > assigned-shards.tsv
          while IFS=$'\t' read -r shard shards; do
            bash .github/scripts/lib/resource_guard.sh \
              bash .github/scripts/check_protocol_shapes.sh "$SHAPE_BUDGET" "$shard" "$shards"
          done < assigned-shards.tsv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-shapes-${{ inputs.shape-budget }}-${{ inputs.shape-window }}-${{ matrix.partition }}
          retention-days: 30
          path: |
            assigned-shards.tsv
            target/protocol-shapes/depth-*/**/inventory.txt
            target/protocol-shapes/depth-*/**/catalog-inventory.txt
            target/protocol-shapes/depth-*/**/catalog.json
            target/protocol-shapes/depth-*/**/diagnostics.tsv
            target/protocol-shapes/depth-*/**/unclassified-rejections.txt
            target/protocol-shapes/depth-*/**/diagnose.time
            target/protocol-shapes/depth-*/**/diagnosis-source.sha256
            target/protocol-shapes/depth-*/**/compiler.txt
            target/protocol-shapes/depth-*/**/revision.txt
            target/protocol-shapes/depth-*/**/source.patch
            target/protocol-shapes/depth-*/**/source.sha256
            target/protocol-shapes/depth-*/**/source-after.sha256
            target/protocol-shapes/depth-*/**/inputs.sha256
            target/protocol-shapes/depth-*/**/inputs-check.log
            target/protocol-shapes/depth-*/**/Cargo.lock
            target/protocol-shapes/depth-*/**/dependencies.sha256
            target/protocol-shapes/depth-*/**/dependencies-check.log
            target/protocol-shapes/depth-*/**/compile.time
            target/protocol-shapes/depth-*/**/execute.time
            target/protocol-shapes/depth-*/**/oracle.time
            target/protocol-shapes/depth-*/**/oracle.log
            target/protocol-shapes/depth-*/**/inputs.json
            target/protocol-shapes/depth-*/**/scope-inputs.json
            target/protocol-shapes/depth-*/**/scope-plans/*.jsonl
            target/protocol-shapes/depth-*/**/scripts/*.jsonl
            target/protocol-shapes/depth-*/**/observations/*.json
            target/protocol-shapes/depth-*/**/scope-observations/*.jsonl
            target/protocol-shapes/depth-*/**/rejected/inventory.tsv
            target/protocol-shapes/depth-*/**/rejected/Cargo.toml
            target/protocol-shapes/depth-*/**/rejected/Cargo.lock
            target/protocol-shapes/depth-*/**/rejected/src/bin/*.rs
            target/protocol-shapes/depth-*/**/rejected/*.jsonl
            target/protocol-shapes/depth-*/**/rejected/*.stderr

  kani:
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'all'
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Kani and CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install stable --profile minimal
          KANI_VERSION="$(< .github/kani-version)"
          cargo +stable install --locked kani-verifier --version "${KANI_VERSION}"
          cargo +stable kani setup
      - name: Run Kani proofs
        run: bash ./.github/scripts/check_kani.sh
      - name: Check delegation equation roots
        run: >-
          bash .github/scripts/lib/resource_guard.sh
          cargo kani --manifest-path proofs/checks/projection/endpoint-delegation/kani/Cargo.toml
          --lib --jobs 1 --output-format terse

  final-form:
    if: github.event_name != 'workflow_dispatch' || inputs.check != 'protocol-shapes'
    runs-on: ubuntu-24.04-arm
    env:
      TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep z3
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --component rust-src
          cargo +stable fmt --version
          MIRI_TOOLCHAIN="$(< .github/miri-toolchain)"
          rustup toolchain install "${MIRI_TOOLCHAIN}" --profile minimal --component miri --component rust-src
          ELAN_VERSION="4.2.3"
          ELAN_ARCHIVE="elan-aarch64-unknown-linux-gnu.tar.gz"
          ELAN_SHA256="cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac"
          ELAN_TMP="$(mktemp -d)"
          ELAN_PATH="${ELAN_TMP}/${ELAN_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/${ELAN_ARCHIVE}" \
            -o "${ELAN_PATH}"
          echo "${ELAN_SHA256}  ${ELAN_PATH}" | sha256sum --check -
          tar -xzf "${ELAN_PATH}" -C "${ELAN_TMP}"
          "${ELAN_TMP}/elan-init" -y --default-toolchain none
          rm -rf "${ELAN_TMP}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
      - name: Check generated protocol shapes through public endpoints
        run: >-
          bash .github/scripts/lib/resource_guard.sh
          bash .github/scripts/check_protocol_shapes.sh
      - name: Check nested roll send admission
        run: >-
          bash .github/scripts/lib/resource_guard.sh
          bash .github/scripts/check_nested_roll_admission.sh
      - name: Run final-form gates
        run: >-
          bash .github/scripts/lib/resource_guard.sh
          bash ./.github/scripts/run_final_form_gates.sh
      - name: Check elastic roll endpoint selectors with Lean and Z3
        run: bash proofs/checks/runtime/roll-reentry-selectors/check.sh
      - name: Check conditional roll continuation dependencies with Lean and Z3
        run: bash proofs/checks/runtime/roll-continuation-dependency/check.sh
      - name: Check parallel resolver progress with Lean and Z3
        run: bash proofs/checks/runtime/parallel-resolver-progress/check.sh
      - name: Check rolled-route ownership with Lean and Z3
        run: bash proofs/checks/runtime/rolled-route-ownership/check.sh
      - name: Check projection diagnostic models with Lean and Z3
        run: |
          ELAN_TOOLCHAIN=leanprover/lean4:v4.30.0 lean proofs/checks/projection/projection-diagnostics/Diagnostics.lean
          bash .github/scripts/check_smt2.sh proofs/checks/projection/projection-diagnostics/Diagnostics.smt2
      - name: Check explicit resource join integration with Lean and Z3
        run: bash proofs/checks/projection/explicit-resource-join/check.sh
      - name: Check receive lane census with Lean and Z3
        run: bash proofs/checks/runtime/recv-lane-census/check.sh
      - name: Check immutable operation lookup with Lean and Z3
        run: bash proofs/checks/image/operation-index/check.sh
      - name: Check completion bitmap traversal with Lean and Z3
        run: bash proofs/checks/runtime/pending-events/check.sh
      - name: Check immutable event admission with Lean and Z3
        run: bash proofs/checks/runtime/event-admission/check.sh
      - name: Check parallel offer ingress handoff with Lean and Z3
        run: bash proofs/checks/runtime/parallel-offer-ingress/check.sh
      - name: Check immutable resolver lookup and dispatch subtree
        run: |
          ELAN_TOOLCHAIN=leanprover/lean4:v4.30.0 lean proofs/checks/image/route-index/SortedRouteIndex.lean
          bash .github/scripts/check_smt2.sh proofs/checks/image/resolver-index/Lookup.smt2
          ELAN_TOOLCHAIN=leanprover/lean4:v4.30.0 lean proofs/checks/image/dispatch-subtree/Dispatch.lean
          bash proofs/checks/image/dispatch-subtree/check.sh
          ELAN_TOOLCHAIN=leanprover/lean4:v4.30.0 lean proofs/checks/image/route-column-access/Bounds.lean
          bash .github/scripts/check_smt2.sh proofs/checks/image/route-column-access/Bounds.smt2
