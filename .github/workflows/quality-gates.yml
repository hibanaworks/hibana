name: quality-gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-source
  cancel-in-progress: true

env:
  TOOLCHAIN: stable
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  preflight:
    runs-on: macos-15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core-preflight
        id: plan

  core:
    needs: preflight
    uses: ./.github/workflows/core-checks.yml
    with:
      matrix: ${{ needs.preflight.outputs.matrix }}
      seed: ${{ needs.preflight.outputs.seed }}

  required:
    name: core-contract
    if: always()
    needs: [preflight, core]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require the tool checks and the complete core contract
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'keys == ["core", "preflight"] and all(.[]; .result == "success")'
          printf '%s\n' 'The complete required finite CI contract passed; see proofs/CI.md for its scope.' >> "$GITHUB_STEP_SUMMARY"
