name: extended-certification

on:
  push:
    tags: ['ci-certify-*']
  workflow_dispatch:
    inputs:
      seed:
        description: Syntax sampling seed; empty uses the UTC date
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: core-source
  cancel-in-progress: true

env:
  TOOLCHAIN: stable
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  preflight:
    runs-on: macos-15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core-preflight
        id: plan
        with:
          extended: 'true'
          seed: ${{ inputs.seed || '' }}

  core:
    needs: preflight
    uses: ./.github/workflows/core-checks.yml
    with:
      matrix: ${{ needs.preflight.outputs.matrix }}
      seed: ${{ needs.preflight.outputs.seed }}

  kani:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Kani and CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install stable --profile minimal
          cargo +stable install --locked kani-verifier --version "$(cat .github/kani-version)"
          cargo +stable kani setup
      - name: Run the complete Kani inventory
        run: bash .github/scripts/check_kani.sh

  proofs:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verification tools
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --component rust-src
          rustup toolchain install "$(cat .github/miri-toolchain)" --profile minimal --component miri --component rust-src
      - uses: ./.github/actions/setup-lean
      - name: Check all additional proof and memory obligations
        run: |
          bash .github/scripts/lib/resource_guard.sh bash .github/scripts/run_extended_gates.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extended-verification
          path: |
            target/miri-parallel-reentry/**
            target/lean-proof/**

  certified:
    name: extended-certification
    if: always()
    needs: [preflight, core, kani, proofs]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every certification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          printf '%s\n' "$RESULTS" |
          jq -e 'keys == ["core", "kani", "preflight", "proofs"] and all(.[]; .result == "success")'

  publish:
    needs: certified
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ci-certify-')
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Advance main and retire integrated branches atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git merge-base --is-ancestor refs/remotes/origin/main HEAD
          updates=('HEAD:refs/heads/main')
          options=(--atomic)
          while read -r ref commit; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in main|HEAD) continue ;; esac
            if git merge-base --is-ancestor "$commit" HEAD; then
              updates+=(":refs/heads/$branch")
              options+=("--force-with-lease=refs/heads/$branch:$commit")
            fi
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/)
          git push "${options[@]}" origin "${updates[@]}"
