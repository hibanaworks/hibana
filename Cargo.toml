[workspace]
members = [".", ".github/ci-tests"]
resolver = "3"

[package]
name          = "hibana"
version       = "0.10.0"
edition       = "2024"
rust-version  = "1.95"
autotests     = false
description   = "Choreographic programming in Rust with runtime-checked projected protocols, no_std and no heap allocation"
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/hibanaworks/hibana"
homepage      = "https://hibanaworks.dev"
documentation = "https://docs.rs/hibana"
readme        = "README.md"
keywords      = ["choreography", "session-types", "mpst", "no-std", "no-alloc"]
categories    = ["asynchronous", "concurrency", "embedded", "network-programming"]
include       = [
    "/Cargo.toml",
    "/README.md",
    "/README.ja.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/.github/assets/hibana-header.svg",
    "/.github/assets/hibana-header-dark.svg",
    "/.github/assets/hibana-header.png",
    "/.github/assets/hibana-header-dark.png",
    "/examples/**",
    "/src/**",
    "!/src/**/tests.rs",
    "!/src/**/tests/**",
    "!/src/**/*_tests.rs",
    "!/src/**/kani.rs",
    "!/src/test_support/**",
    "!/src/endpoint/kernel/test_support/**",
]

[features]
default = []

[lints.rust]
long_running_const_eval = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hibana_repo_tests)', 'cfg(kani)'] }

[package.metadata.docs.rs]
all-features = false
no-default-features = true
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# No external dependencies - hibana core remains self-contained

[dev-dependencies]
futures = "0.3"
libc = "0.2"
static_assertions = "1.1"
trybuild = "1.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util", "test-util"] }

